# ws-chat — two services exposed by freeholdy:
#   web        -> web.{project}.{domain}        (React UI, static, nginx)
#   websocket  -> websocket.{project}.{domain}  (Node.js ws server)
# freeholdy rewrites these ports to loopback bindings and proxies them via nginx.
# The 'websocket' service name is what makes nginx emit WebSocket upgrade headers.
services:
  web:
    build:
      context: ./frontend
      args:
        # Chat room name baked into the frontend bundle. Defaults to "ws-chat";
        # override by exporting CHAT_NAME (or adding a CHAT_NAME=… line to a .env
        # file next to this compose file — freeholdy uploads it with the project).
        VITE_CHAT_NAME: ${CHAT_NAME:-ws-chat}
    ports:
      - "80"
  websocket:
    build: ./backend
    ports:
      - "8080"
    volumes:
      # Chat history lives in a SQLite file on a named volume, so it survives a restart,
      # a redeploy and a rollback (freeholdy versions code + images, never volume data).
      # freeholdy lists this volume, reports its size, and can tar it out and back in.
      - chat-data:/data

volumes:
  chat-data:
