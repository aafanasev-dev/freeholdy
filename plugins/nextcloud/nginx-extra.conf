# Nextcloud nginx extras — inlined by freeholdy into every SSL server block
# (see nginx_service._load_extra_config). Server-context directives only; the
# .well-known redirects must live at server level, next to the template's
# `location /`.

# Large uploads: must match PHP_UPLOAD_LIMIT in docker-compose.yml or files
# over nginx's 1m default 413 before PHP ever sees them.
client_max_body_size 10G;
client_body_timeout 300s;
proxy_request_buffering off;
proxy_read_timeout 300s;
send_timeout 300s;

# Nextcloud's admin overview flags a missing HSTS header.
add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

# CalDAV/CardDAV client discovery (Nextcloud security scan checks these).
location = /.well-known/carddav { return 301 /remote.php/dav/; }
location = /.well-known/caldav  { return 301 /remote.php/dav/; }
