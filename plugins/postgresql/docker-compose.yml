# PostgreSQL — one database server per project, reachable at {project}.{BASE_DOMAIN}.
#
# Proxying: the label `freeholdy.proxy: tcp` makes freeholdy serve this service through
# nginx's `stream` module instead of an HTTP vhost (port 80 keeps answering only the
# Let's Encrypt challenge, there is no 443 site). How clients get in is chosen at install
# time and stored in nginx-stream.json next to this file:
#   * SNI  — shared public port 5432; nginx terminates TLS with the LE cert for
#            {project}.{BASE_DOMAIN} and routes by hostname (libpq 17+, sslnegotiation=direct).
#   * port — a dedicated public port passed straight through; postgres does its own TLS
#            (self-signed cert in ./tls, generated by install.sh) — works with any client.
#
# Ports: 127.0.0.1::5432 is loopback-pinned and ephemeral; freeholdy's override appends
# the real allocated 127.0.0.1:{local_port}:5432 binding that nginx proxies to. Nothing is
# ever published on a public interface by docker itself.
#
# Data: the named volume `data` is a bind of ${PG_DATA_DIR} = {DATA_DIR}/postgresql/{project}
# on the host, so every instance has its own folder, and freeholdy's volume features
# (list, download/upload, backups) keep working on it. It lives outside the project dir
# on purpose — version snapshots copy that dir and git deploys wipe it.
#
# TLS key: postgres refuses a key that is not 0600 and owned by its user, so the
# entrypoint copies ./tls into /run/pgtls as root with the right owner/mode, then hands
# off to the stock entrypoint. ($$ escapes compose interpolation.)
#
# Variables (written to .env by install.sh's pre phase): PG_DB, PG_USER, PG_PASSWORD,
# PG_DATA_DIR. POSTGRES_* only matter on the FIRST start with an empty data folder —
# afterwards the cluster keeps the user/password it was initialised with.

services:
  db:
    image: postgres:17
    ports:
      - "127.0.0.1::5432"
    labels:
      freeholdy.proxy: tcp
    environment:
      - POSTGRES_DB=${PG_DB}
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
    volumes:
      - data:/var/lib/postgresql/data
      - ./tls:/tls-src:ro
    entrypoint:
      - bash
      - -c
      - >-
        install -d -o postgres -g postgres -m 700 /run/pgtls &&
        install -o postgres -g postgres -m 600 /tls-src/server.key /run/pgtls/server.key &&
        install -o postgres -g postgres -m 644 /tls-src/server.crt /run/pgtls/server.crt &&
        exec docker-entrypoint.sh "$$@"
      - --
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/pgtls/server.crt
      - -c
      - ssl_key_file=/run/pgtls/server.key
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PG_DATA_DIR}
