# imgstore nginx extras — inlined by freeholdy into every SSL server block of this
# project (see app/services/nginx_service.py::_load_extra_config). Server-context
# directives only.
#
# Uploads flow through the front nginx to the storage container; without this the
# default 1m body limit would 413 anything but the smallest image before Node ever
# sees it. Harmless on the `web` (static) block.
client_max_body_size 50M;
